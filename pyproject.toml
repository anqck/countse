    "addict==2.4.0",
    "colorlog==6.8.2",
    "cython==3.0.9",
    "numpy==1.26.4",
    "opencv-python==4.9.0.80",
    "pycocotools==2.0.7",
    "pyyaml==6.0.1",
    "scipy==1.12.0",
    "submitit==1.5.1",
    "supervision==0.6.0",
    "termcolor==2.4.0",
    "timm==0.9.16",
    "torch==2.10.0+cu128",
    "torchaudio==2.10.0",
    "torchvision==0.25.0+cu128",
    "transformers==4.39.1",
    "yapf==0.40.1",
